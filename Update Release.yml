info:
  name: Update Release
  type: http
  seq: 9

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/releases/{{releaseId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "service": "{{serviceId}}",
        "version": "1.0.1",
        "changelog": "Bug fixes"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
