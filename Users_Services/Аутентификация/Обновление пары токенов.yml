info:
  name: Обновление пары токенов
  type: http
  seq: 2
  tags:
    - Аутентификация

http:
  method: POST
  url: "{{baseUrl}}/api/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": {
          "value": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": {
              "value": ""
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "accessToken": {
                "value": ""
              },
              "refreshToken": {
                "value": ""
              }
            }
          }

docs: |
  Отзывает предъявленный refresh токен и выдаёт новую пару — ротация.

  Тело запроса: {"refreshToken":"<значение>"} — значение строкой, не объектом.

  Требования к токену: он должен быть ACTIVE и не просрочен, а его владелец —
  иметь статус ACTIVE.

  Ротация и выдача новой пары выполняются в одной транзакции. Если на любом шаге
  после отзыва произойдёт сбой, откат вернёт предъявленный токен в рабочее
  состояние, и запрос можно будет повторить тем же токеном.

  Ответы:
  - 200 — в payload новая пара: accessToken (JWT, RS256, 15 минут) и
  refreshToken (256 бит случайности, 30 дней).
  - 401 — токен не передан, не найден, уже отозван, просрочен или его владелец
  больше не существует. Ответ во всех этих случаях одинаковый, чтобы по нему
  нельзя было определить, существовал ли токен.
  - 403 — токен верен, но аккаунт не активен (статус INACTIVE или BANNED).
