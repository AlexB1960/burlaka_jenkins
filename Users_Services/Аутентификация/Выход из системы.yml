info:
  name: Выход из системы
  type: http
  seq: 3
  tags:
    - Аутентификация

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout"
  body:
    type: json
    data: |-
      {
        "refreshToken": {
          "value": ""
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/auth/logout"
      method: POST
      body:
        type: json
        data: |-
          {
            "refreshToken": {
              "value": ""
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {}
          }

docs: |
  Отзывает предъявленный refresh токен и завершает только эту сессию.

  Тело запроса: {"refreshToken":"<значение>"} — значение строкой, не объектом.

  Что происходит:
  - отзывается только тот токен, который передан. Токены других устройств
  продолжают работать;
  - уже выданный access токен не отзывается: он остаётся действительным до
  истечения своего срока (15 минут);
  - аутентификация не требуется, владение доказывается самим refresh токеном.
  Поэтому выйти можно и после того, как access токен истёк.

  Ответы:
  - 200 — токен отозван либо был непригоден (не найден, уже отозван,
  просрочен). Вызов идемпотентен: повторный выход с тем же токеном тоже 200,
  и по ответу нельзя отличить «такого токена не было» от «он уже отозван».
  - 401 — refresh токен не передан или пуст.
