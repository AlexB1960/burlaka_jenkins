info:
  name: registerUser_200
  type: http
  seq: 1
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/user/register"
  body:
    type: json
    data: |-
      {
        "user": {
          "login": "TestLogin",
          "password": "TestPassword",
          "email": "TestEmail",
          "fio": {
            "firstName": "TestName",
            "lastName": "TestLastname",
            "secondName": "TestSecondname"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();
        if (body?.id) {
          const userId = res.body.id;
          bru.setVar("testUserID", userId);
        }
    - type: tests
      code: |-
        test("Status cod = 200", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "user": {
              "login": "",
              "password": "",
              "email": "",
              "fio": {
                "firstName": "",
                "lastName": "",
                "secondName": ""
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }
