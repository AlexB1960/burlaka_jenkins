info:
  name: getUserById_200
  type: http
  seq: 9
  tags:
    - user-controller

http:
  method: GET
  url: "{{baseUrl}}/api/user/:id"
  params:
    - name: id
      value: "{{testByIdUserId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Создание нового тестового пользователя
        const baseURL = bru.getEnvVar('baseUrl');

        const suffix = Math.random().toString(36).substring(2, 8);
        const userData = {
          "user": {
            "login": "testLogin_" + suffix,
            "password": "testPassword_" + suffix,
            "email": "test_" + suffix + "@mail.ru",
            "fio": {
              "firstName": "testName_ById",
              "lastName": "testLastname_ById",
              "secondName": "testSecondname_ById"
            }
          }
        };

        const resNew = await bru.sendRequest({
          method: 'POST',
          url: `${baseURL}/api/user/register`,
          headers: { 'Content-Type': 'application/json' },
          data: userData,
          timeout: 10000
        });

        if (resNew.status === 201) {
          const newId = resNew.data?.payload?.user?.id || resNew.data?.id || resNew.body?.payload?.user?.id;
          if (!newId) throw new Error('It was impossible to get ID from response');
          
          bru.setVar('testByIdUserId', newId);
        } else {
          throw new Error(`Error creating user: status ${resNew.status}`);
        }
    - type: after-response
      code: |-
        // Удаление тестового пользователя
        const baseURL = bru.getEnvVar('baseUrl');
        const userId = bru.getVar('testByIdUserId');

        if (!userId) {
          console.log('⚠️ Post-response: testUserId is not found. Perhaps the Pre-request didn’t work.');
          return;
        }

        try {
          const deleteRes = await bru.sendRequest({
            method: 'DELETE',
            url: `${baseURL}/api/user/${userId}`,
            headers: { 'Content-Type': 'application/json' },
            timeout: 5000
          });

          if ([200, 204].includes(deleteRes.status)) {
            //bru.setVar('testByIdUserId', null);
            bru.deleteVar('testByIdUserId');
          } else if (deleteRes.status === 404) {
            console.warn(`⚠️ User ${userId} is not found (It may have been deleted earlier).`);
          } else {
            console.warn(`⚠️ Server returns the status ${deleteRes.status} when removing.`);
          }
        } catch (err) {
          console.error(`💥 Critical error during deletion: ${err.message}`);
        }
    - type: tests
      code: |-
        test("Status cod = 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Status text = OK", function () {
            const body = res.getBody();
            expect(body.status).to.equal("OK");
        });

        const fio = res.body.payload.user.fio;
        test("Field firstName = testName_ById", function () {
          expect(fio.firstName).to.equal("testName_ById");
        });

        test("Field lastName = testLastname_ById", function () {
          expect(fio.lastName).to.equal("testLastname_ById");
        });

        test("Field secondName = testSecondname_ById", function () {
          expect(fio.secondName).to.equal("testSecondname_ById");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }
