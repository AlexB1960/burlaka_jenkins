info:
  name: register_400_email
  type: http
  seq: 25
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/user/register"
  body:
    type: json
    data: |-
      {
        "user": {
          "login": "testLogin",
          "password": "testPassword",
          "email": "ru",
          "fio": {
            "firstName": "testName",
            "lastName": "testLastName",
            "secondName": "testSecondName"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status cod = 400", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("Status text = BAD_REQUEST", function () {
            const body = res.getBody();
            expect(body.status).to.equal("BAD_REQUEST");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "user": {
              "login": "",
              "password": "",
              "email": "",
              "fio": {
                "firstName": "",
                "lastName": "",
                "secondName": ""
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }
