info:
  name: updateUser_500
  type: http
  seq: 20
  tags:
    - user-controller

http:
  method: PATCH
  url: "{{baseUrl}}/api/user/:id"
  params:
    - name: id
      value: Wrong-Format-of-User-Id
      type: path
  body:
    type: json
    data: |-
      {
        "password": "ChangedPassword",
        "fio": {
          "firstName": "ChangedFirstName",
          "lastName": "ChangedLastName",
          "secondName": "ChangedSecondtName"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status cod = 500", function () {
          expect(res.getStatus()).to.equal(500);
        });

        test("Status text = INTERNAL_SERVER_ERROR", function () {
            const body = res.getBody();
            expect(body.status).to.equal("INTERNAL_SERVER_ERROR");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

