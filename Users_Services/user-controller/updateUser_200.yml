info:
  name: updateUser_200
  type: http
  seq: 18
  tags:
    - user-controller

http:
  method: PATCH
  url: "{{baseUrl}}/api/user/:id"
  params:
    - name: id
      value: "{{testUpdateUserId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "user": {
          "login": "",
          "password": "",
          "email": null,
          "fio": {
            "firstName": "ChangedFirstName",
            "lastName": "ChangedLastName",
            "secondName": "ChangedSecondtName"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseURL = bru.getEnvVar('baseUrl');

        const suffix = Math.random().toString(36).substring(2, 8);
        const userData = {
          "user": {
            "login": "testLogin_" + suffix,
            "password": "testPassword_" + suffix,
            "email": "test_" + suffix + "@mail.ru",
            "fio": {
              "firstName": "testName",
              "lastName": "testLastname",
              "secondName": "testSecondname"
            }
          }
        };

        const resNew = await bru.sendRequest({
          method: 'POST',
          url: `${baseURL}/api/user/register`,
          headers: { 'Content-Type': 'application/json' },
          data: userData,
          timeout: 10000
        });

        if (resNew.status === 201) {
          const newId = resNew.data?.payload?.user?.id || resNew.data?.id || resNew.body?.payload?.user?.id;
          if (!newId) throw new Error('It was impossible to get ID from response');
          
          bru.setVar('testUpdateUserId', newId);
        } else {
          throw new Error(`Error creating user: status ${resNew.status}`);
        }
    - type: tests
      code: |-
        test("Status cod = 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Status text = OK", function () {
            const body = res.getBody();
            expect(body.status).to.equal("OK");
        });

        const fio = res.body.payload.user.fio;
        test("Response: Field firstName = ChangedFirstName", function () {
          expect(fio.firstName).to.equal("ChangedFirstName");
        });

        test("Response: Field lastName = ChangedLastName", function () {
          expect(fio.lastName).to.equal("ChangedLastName");
        });

        test("Response: Field secondName = ChangedSecondtName", function () {
          expect(fio.secondName).to.equal("ChangedSecondtName");
        });


        const baseURL = bru.getEnvVar('baseUrl');
        const userId = bru.getVar('testUpdateUserId');
        try {
          const checkRes = await bru.sendRequest({
            method: 'GET',
            url: `${baseURL}/api/user/${userId}`,
            headers: { 'Content-Type': 'application/json' },
            timeout: 5000
          });

          test('GET: Field firstName = ChangedFirstName', function() {
            expect(checkRes.data.payload.user.fio.firstName).to.equal('ChangedFirstName');
          });
          test('GET: Field lastName = ChangedLastName', function() {
            expect(checkRes.data.payload.user.fio.lastName).to.equal('ChangedLastName');
          });
          test('GET: Field secondName = ChangedSecondtName', function() {
            expect(checkRes.data.payload.user.fio.secondName).to.equal('ChangedSecondtName');
          });
        } catch (err) {
          console.error('GET-проверка не удалась:', err.message);
        }

        try {
          await bru.sendRequest({
            method: 'DELETE',
            url: `${baseURL}/api/user/${userId}`,
            headers: { 'Content-Type': 'application/json' },
            timeout: 5000
          });
          //console.log('🧹 Тестовый пользователь удалён');
        } catch (err) {
          console.error('⚠️ Ошибка очистки:', err.message);
        }

        bru.deleteVar('testUpdateUserId');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

