info:
  name: register_dataset-
  type: http
  seq: 23
  tags:
    - user-controller

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseURL = bru.getEnvVar('baseUrl');

        function assertStatus(idx, expected, note, actual) {
          test(`Dataset ${idx}: status ${expected} (${note})`, function() {
            expect(actual).to.equal(expected);
          });
        }

        const testData = [
          { note: "Invalid email=test", login: "testLogin", password: "testPassword", email: "test", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Invalid email=mail.ru", login: "testLogin", password: "testPassword", email: "mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Invalid email=@.ru", login: "testLogin", password: "testPassword", email: "@.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Invalid firstName = empty", login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "", lastName: "Petrov", secondName: "Petrovich", cod: 400 },
          { note: "Invalid firstName = 1 sign", login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "S", lastName: "Sidorov", secondName: "Sidorovich", cod: 400 },
          { note: "Invalid lastName = empty", login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "Ivan", lastName: "", secondName: "Petrovich", cod: 400 }
        ];

        console.log(`🚀 Start ${testData.length} negative datasets...`);

        let passed = 0;
        let failed = 0;

        for (let i = 0; i < testData.length; i++) {
          const data = testData[i];
          const suffix = Math.random().toString(36).substring(2, 8);
          const uniqueLogin = data.login + "_" + suffix;
          const uniquePassword = data.password + "_" + suffix;
          const uniqueEmail = suffix + "_" + data.email;

          console.log(`\n📦 Dataset ${i + 1}/${testData.length} (${data.note}): login=${uniqueLogin}, email=${uniqueEmail}, firstName=${data.firstName}, lastName=${data.lastName}, secondName=${data.secondName}, expected status=${data.cod}`);

          const requestBody = {
            user: {
              login: uniqueLogin,
              password: uniquePassword,
              email: uniqueEmail,
              fio: {
                firstName: data.firstName,
                lastName: data.lastName,
                secondName: data.secondName
              }
            }
          };

          let actualStatus = null;
          let userId = null;
          let requestError = null;

          try {
            const res = await bru.sendRequest({
              method: 'POST',
              url: `${baseURL}/api/user/register`,
              headers: { 'Content-Type': 'application/json' },
              data: requestBody,
              timeout: 10000
            });
            actualStatus = res.status;
            userId = res.data?.payload?.user?.id;
          } catch (err) {
            requestError = err;
            actualStatus = err.response?.status || err.status || null;
          }

          assertStatus(i + 1, data.cod, data.note, actualStatus);

          if (actualStatus === data.cod) {
            console.log(`✅ Dataset ${i + 1}: passed — received status ${actualStatus}`);
            passed++;
          } else {
            console.log(`❌ Dataset ${i + 1}: failed — expected status ${data.cod}, received status ${actualStatus}`);
            failed++;
          }

          if (userId) {
            console.log(`⚠️ Dataset ${i + 1}: wrong created user ID=${userId},  is being deleted...`);
            try {
              const delRes = await bru.sendRequest({
                method: 'DELETE',
                url: `${baseURL}/api/user/${userId}`,
                headers: { 'Content-Type': 'application/json' },
                timeout: 5000
              });
              console.log(`🧹 User ${userId} is deleted (status ${delRes.status}).`);
            } catch (err) {
              const delStatus = err.response?.status || err.status || 'unknown';
              if (delStatus === 404) {
                console.log(`🧹 User ${userId} has already deleted (404).`);
              } else {
                console.warn(`⚠️ User could not been deleted ${userId} (status ${delStatus}): ${err.message}`);
              }
            }
          }
        }

        console.log(`\n${'='.repeat(50)}`);
        console.log(`📊 Total: ${passed} passed, ${failed} failed from ${testData.length} datasets`);
        console.log(`${'='.repeat(50)}`);

        if (failed > 0) {
          test(`Total: ${failed} failed from ${testData.length} datasets`, function() {
            expect.fail(`${failed} failed from ${testData.length} datasets`);
          });
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "user": {
              "login": "",
              "password": "",
              "email": "",
              "fio": {
                "firstName": "",
                "lastName": "",
                "secondName": ""
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }
