info:
  name: register_dataset+ copy
  type: http
  seq: 28
  tags:
    - user-controller

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseURL = bru.getEnvVar('baseUrl');

        //Наборы тестовых данных
        const testData = [
          { login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 201 },
          { login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "Petr", lastName: "Petrov", secondName: "Petrovich", cod: 201 },
          { login: "testLogin", password: "testPassword", email: "test@mail.ru", firstName: "Sidor", lastName: "Sidorov", secondName: "Sidorovich", cod: 201 }
        ];

        console.log(`🚀 Запуск ${testData.length} наборов тестовых данных...`);

        //Рабочий цикл с тестовыми наборами : Создание тестового пользователя - Проверка получения кода статуса 201 - Удаление тестового пользователя
        for (let i = 0; i < testData.length; i++) {
          const data = testData[i];
          const suffix = Math.random().toString(36).substring(2, 8);
          const uniqueLogin = data.login + "_" + suffix;
          const uniquePassword = data.password + "_" + suffix;
          const uniqueEmail = suffix + "_" + data.email;

          console.log(`\n📦 Набор данных ${i + 1}/${testData.length}: login=${uniqueLogin}, email=${uniqueEmail}, firstName=${testData[i].firstName}, lastName=${testData[i].lastName}, secondName=${testData[i].secondName}`);

          const requestBody = {
            user: {
              login: uniqueLogin,
              password: uniquePassword,
              email: uniqueEmail,
              fio: {
                firstName: data.firstName,
                lastName: data.lastName,
                secondName: data.secondName
              }
            }
          };

          let userId;

          // --- Создание тестового пользователя---
          try {
            const res = await bru.sendRequest({
              method: 'POST',
              url: `${baseURL}/api/user/register`,
              headers: { 'Content-Type': 'application/json' },
              data: requestBody,
              timeout: 10000
            });

            if (res.status !== testData[i].cod) {
              throw new Error(`Ожидался статус ${testData[i].cod}, получен ${res.status}.`);
            }

            userId = res.data?.payload?.user?.id;
            if (!userId) {
              throw new Error('Не удалось извлечь ID из ответа.');
            }

            console.log(`✅ Набор данных ${i + 1}: создан пользователь (статус ${testData[i].cod}), ID=${userId}`);
          } catch (err) {
            throw new Error(`❌ Набор данных ${i + 1}: ошибка создания — ${err.message}`);
          }

          // --- Удаление тестового пользователя---
          try {
            const delRes = await bru.sendRequest({
              method: 'DELETE',
              url: `${baseURL}/api/user/${userId}`,
              headers: { 'Content-Type': 'application/json' },
              timeout: 5000
            });

            console.log(`🧹 Набор данных ${i + 1}: пользователь ${userId} удалён (статус ${delRes.status}).`);
          } catch (err) {
            const status = err.response?.status || err.status || 'unknown';
            if (status === 404) {
              console.warn(`⚠️ Набор данных ${i + 1}: пользователь ${userId} уже удалён (404).`);
            } else {
              console.warn(`⚠️ Набор данных ${i + 1}: ошибка удаления (статус ${status}): ${err.message}`);
            }
          }
        }

        console.log(`\n✅ Все ${testData.length} наборов данных протестированы успешно.`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "user": {
              "login": "",
              "password": "",
              "email": "",
              "fio": {
                "firstName": "",
                "lastName": "",
                "secondName": ""
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }
