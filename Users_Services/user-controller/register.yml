info:
  name: register
  type: http
  seq: 1
  tags:
    - user-controller

http:
  method: POST
  url: "{{baseUrl}}/api/user/register"
  body:
    type: json
    data: |-
      {
        "user": {
          "login": "1qweqw",
          "password": "1qweq",
          "email": "1qwe@mail.ru",
          "fio": {
            "firstName": "1zsdfadsa",
            "lastName": "1465h",
            "secondName": "1sdjhfg"
          }
        }
      }
