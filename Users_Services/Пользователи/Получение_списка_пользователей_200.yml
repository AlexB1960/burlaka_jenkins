info:
  name: Получение_списка_пользователей_200
  type: http
  seq: 16
  tags:
    - Пользователи

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  params:
    - name: page
      value: "1"
      type: query
    - name: size
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status cod = 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Status text = OK", function () {
          const body = res.getBody();
          expect(body.status).to.equal("OK");
        });

        test("All users in list have valid and non-empty fields", function () {
          const body = res.getBody();
          const users = body.payload?.users;

          expect(users, "Field 'users' should be an array").to.not.be.undefined;
          expect(Array.isArray(users), "Field 'users' should be an array").to.be.true;

          if (users.length === 0) {
            console.warn("⚠️ The users list is empty. Field validation will be skipped.");
            return;
          }

          const emailRegexStr = bru.getEnvVar('regexEmail');
          const loginRegexStr = bru.getEnvVar('regexLogin');

          if (!emailRegexStr || !loginRegexStr) {
            throw new Error("❌ Environment variables 'regexEmail' and/or 'regexLogin' are not set.");
          }

          const emailRegex = new RegExp(emailRegexStr);
          const loginRegex = new RegExp(loginRegexStr);

          console.log(`🔍 Checking fields validity for ${users.length} users...`);

          const errors = [];
          users.forEach((user, index) => {
            const fio = user.fio;

            if (!fio) {
              errors.push(`User [${index}]: fio object is missing.`);
              return;
            }

            if (!fio.firstName || fio.firstName.trim() === "") {
              errors.push(`User [${index}]: firstName is empty.`);
            }
            if (!fio.lastName || fio.lastName.trim() === "") {
              errors.push(`User [${index}]: lastName is empty.`);
            }
            if (!fio.secondName || fio.secondName.trim() === "") {
              //errors.push(`User [${index}]: secondName is empty.`);
            }

            const login = user.login;
            if (typeof login !== "string" || login.trim() === "") {
              errors.push(`User [${index}]: login is missing or empty.`);
            } else if (!loginRegex.test(login)) {
              errors.push(`User [${index}]: incorrect login format '${login}'.`);
            }

            const email = user.email;
            if (typeof email !== "string" || email.trim() === "") {
              errors.push(`User [${index}]: email is missing or empty.`);
            } else if (!emailRegex.test(email)) {
              errors.push(`User [${index}]: incorrect email format '${email}'.`);
            }

            if (errors.length === 0 || errors.every(e => !e.startsWith(`User [${index}]`))) {
              console.log(`✅ User [${index}] is checked: FIO, login, email — OK.`);
            }
          });

          if (errors.length > 0) {
            const message = errors.join("\n");
            expect.fail(`❌ ${errors.length} error(s) found:\n${message}`);
          }

          console.log(`✅ All ${users.length} users checked — all fields are valid!`);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user"
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: size
          value: "10"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "page": 0,
              "pageCount": 0,
              "countOnPage": 0,
              "users": [
                {
                  "id": "",
                  "login": "",
                  "email": "",
                  "fio": {
                    "firstName": "",
                    "lastName": "",
                    "secondName": ""
                  }
                }
              ]
            }
          }

docs: |
  Возвращает пользователей постранично. Удалённые пользователи в выборку не попадают.

  Параметры запроса:
  - page — номер страницы, нумерация с 1 (по умолчанию 1).
  - size — количество пользователей на странице (по умолчанию 10).

  Ответы:
  - 200 — страница пользователей: в payload список users, номер запрошенной страницы page,
  общее количество страниц pageCount и размер страницы countOnPage.
  - 400 — page меньше 1.
