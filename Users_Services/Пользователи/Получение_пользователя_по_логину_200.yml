info:
  name: Получение_пользователя_по_логину_200
  type: http
  seq: 13
  tags:
    - Пользователи

http:
  method: GET
  url: "{{baseUrl}}/api/user/login/:login"
  params:
    - name: login
      value: "{{testUserLogin}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Создание нового тестового пользователя с testUserLogin
        const baseURL = bru.getEnvVar('baseUrl');

        const suffix = Math.random().toString(36).substring(2, 8);
        const userData = {
          "user": {
            "login": "testLogin" + suffix,
            "password": "testPassword" + suffix,
            "email": "test" + suffix + "@mail.ru",
            "fio": {
              "firstName": "testName_ByLogin",
              "lastName": "testLastname_ByLogin",
              "secondName": "testSecondname_ByLogin"
            }
          }
        };

        const resNew = await bru.sendRequest({
          method: 'POST',
          url: `${baseURL}/api/user/register`,
          headers: { 'Content-Type': 'application/json' },
          data: userData,
          timeout: 10000
        });

        if (resNew.status === 201) {
          const newId = resNew.data?.payload?.user?.id || resNew.data?.id || resNew.body?.payload?.user?.id;
          if (!newId) throw new Error('Невозможно извлечь ID из полученного response');
          const newLogin = resNew.data?.payload?.user?.login || resNew.data?.login || resNew.body?.payload?.user?.login;
          if (!newLogin) throw new Error('Невозможно извлечь Login из полученного response');
          
          bru.setVar('testByLoginUserId', newId);
          bru.setVar('testUserLogin', newLogin);
        } else {
          throw new Error(`Ошибка создания тестового пользователя: статус ${resNew.status}`);
        }
    - type: tests
      code: |-
        test("Status cod = 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Status text = OK", function () {
            const body = res.getBody();
            expect(body.status).to.equal("OK");
        });

        const fio = res.body.payload.user.fio;
        test("Field firstName = testName_ByLogin", function () {
          expect(fio.firstName).to.equal("testName_ByLogin");
        });

        test("Field lastName = testLastname_ByLogin", function () {
          expect(fio.lastName).to.equal("testLastname_ByLogin");
        });

        test("Field secondName = testSecondname_ByLogin", function () {
          expect(fio.secondName).to.equal("testSecondname_ByLogin");
        });

        // Удаление тестового пользователя
        const baseURL = bru.getEnvVar('baseUrl');
        const userId = bru.getVar('testByLoginUserId');

        if (!userId) {
          console.log('⚠️ Post-response: Не найден testUserId. Возможно, что не сработал Pre-request.');
          return;
        }

        try {
          const deleteRes = await bru.sendRequest({
            method: 'DELETE',
            url: `${baseURL}/api/user/${userId}`,
            headers: { 'Content-Type': 'application/json' },
            timeout: 5000
          });

          if ([200, 204].includes(deleteRes.status)) {
            bru.deleteVar('testByLoginUserId');
            bru.deleteVar('testUserLogin');
          } else if (deleteRes.status === 404) {
            console.warn(`⚠️ Пользователь ${userId} не найден (Возможно, он был удален раньше).`);
          } else {
            console.warn(`⚠️ Сервер вернул статус ${deleteRes.status} при удалении.`);
          }
        } catch (err) {
          console.error(`💥 Критическая ошибка при удалении: ${err.message}`);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/login/:login"
      method: GET
      params:
        - name: login
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }

docs: |
  Возвращает пользователя по логину. Логин из пути обрезается по краям и приводится
  к нижнему регистру, поэтому поиск регистронезависимый.

  Ответы:
  - 200 — пользователь найден; в payload возвращаются id, login, email и ФИО.
  - 404 — пользователь не найден, в том числе если он был удалён.
