info:
  name: Получение_пользователя_по_email_404
  type: http
  seq: 7
  tags:
    - Пользователи

http:
  method: GET
  url: "{{baseUrl}}/api/user/email/:email"
  params:
    - name: email
      value: not@exits.email
      type: path
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status cod = 404", function () {
          expect(res.getStatus()).to.equal(404);
        });

        test("Status text = NOT_FOUND", function () {
            const body = res.getBody();
            expect(body.status).to.equal("NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/email/:email"
      method: GET
      params:
        - name: email
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }

docs: |
  Возвращает пользователя по email. Совпадение точное: регистр и пробелы не нормализуются.

  Ответы:
  - 200 — пользователь найден; в payload возвращаются id, login, email и ФИО.
  - 404 — пользователь не найден, в том числе если он был удалён.
