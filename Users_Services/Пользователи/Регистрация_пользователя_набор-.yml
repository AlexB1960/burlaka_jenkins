info:
  name: Регистрация_пользователя_набор-
  type: http
  seq: 27
  tags:
    - Пользователи

http:
  method: GET
  url: "{{baseUrl}}/api/user"
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const baseURL = bru.getEnvVar('baseUrl');

        // --- Хелпер для тестов (вне цикла) ---
        function assertStatus(idx, expected, note, actual) {
          test(`Набор ${idx}: статус ${expected} (${note})`, function() {
            expect(actual).to.equal(expected);
          });
        }

        // Наборы негативных тестовых данных
        const testData = [
          { note: "Невалидный login=Логин", login: "Логин", password: "testPasswordN", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный login=пустой", login: "", password: "testPasswordN", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный login=пробел", login: " ", password: "testPasswordN", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный password=пустой", login: "testLoginN", password: "", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный password=пробел", login: "testLoginN", password: " ", email: "test@mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный email=пустой", login: "testLoginN", password: "testPasswordN", email: "", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный email=пробел", login: "testLoginN", password: "testPasswordN", email: " ", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный email=test", login: "testLoginN", password: "testPasswordN", email: "test", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный email=mail.ru", login: "testLoginN", password: "testPasswordN", email: "mail.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный email=@.ru", login: "testLoginN", password: "testPasswordN", email: "@.ru", firstName: "Ivan", lastName: "Ivanov", secondName: "Ivanovich", cod: 400 },
          { note: "Невалидный firstName = пустой", login: "testLoginN", password: "testPasswordN", email: "test@mail.ru", firstName: "", lastName: "Petrov", secondName: "Petrovich", cod: 400 },
          { note: "Невалидный firstName = пробел", login: "testLoginN", password: "testPasswordN", email: "test@mail.ru", firstName: " ", lastName: "Petrov", secondName: "Petrovich", cod: 400 },
          { note: "Невалидный lastName = пустой", login: "testLoginN", password: "testPasswordN", email: "test@mail.ru", firstName: "Ivan", lastName: "", secondName: "Petrovich", cod: 400 },
          { note: "Невалидный lastName = пробел", login: "testLoginN", password: "testPasswordN", email: "test@mail.ru", firstName: "Ivan", lastName: " ", secondName: "Petrovich", cod: 400 }
        ];

        console.log(`🚀 Запуск ${testData.length} наборов негативных тестовых данных...`);

        let passed = 0;
        let failed = 0;

        for (let i = 0; i < testData.length; i++) {
          const data = testData[i];
          //const suffix = Math.random().toString(36).substring(2, 8);
          //const uniqueLogin = data.login + suffix;
          //const uniquePassword = data.password + suffix;
          //const uniqueEmail = suffix + data.email;

          console.log(`\n📦 Набор ${i + 1}/${testData.length} (${data.note}): login=${data.login}, email=${data.email}, firstName=${data.firstName}, lastName=${data.lastName}, secondName=${data.secondName}, ожидаемый статус=${data.cod}`);

          const requestBody = {
            user: {
              login: data.login,
              password: data.password,
              email: data.email,
              fio: {
                firstName: data.firstName,
                lastName: data.lastName,
                secondName: data.secondName
              }
            }
          };

          let actualStatus = null;
          let userId = null;
          let requestError = null;

          // --- Отправка запроса ---
          try {
            const res = await bru.sendRequest({
              method: 'POST',
              url: `${baseURL}/api/user/register`,
              headers: { 'Content-Type': 'application/json' },
              data: requestBody,
              timeout: 10000
            });
            // Сюда попадаем только при статусе 2xx
            actualStatus = res.status;
            userId = res.data?.payload?.user?.id;
          } catch (err) {
            // Сюда попадаем при статусе 400+
            requestError = err;
            actualStatus = err.response?.status || err.status || null;
          }

          // --- Проверка статуса (функция assertStatus объявлена вне цикла)---
          assertStatus(i + 1, data.cod, data.note, actualStatus);

          if (actualStatus === data.cod) {
            console.log(`✅ Набор ${i + 1}: прошел — получен статус ${actualStatus}`);
            passed++;
          } else {
            console.log(`❌ Набор ${i + 1}: провален — ожидался статус ${data.cod}, получен статус ${actualStatus}`);
            failed++;
          }

          // --- Очистка: если сервер ошибочно создал пользователя ---
          if (userId) {
            console.log(`⚠️ Набор ${i + 1}: ошибочно созданный пользователь ID=${userId} удаляется...`);
            try {
              const delRes = await bru.sendRequest({
                method: 'DELETE',
                url: `${baseURL}/api/user/${userId}`,
                headers: { 'Content-Type': 'application/json' },
                timeout: 5000
              });
              console.log(`🧹 Набор ${i + 1}: пользователь ${userId} удален (статус ${delRes.status}).`);
            } catch (err) {
              const delStatus = err.response?.status || err.status || 'unknown';
              if (delStatus === 404) {
                console.log(`🧹 Набор ${i + 1}: пользователь ${userId} уже был удален (404).`);
              } else {
                console.warn(`⚠️ Набор ${i + 1}: не удалось удалить пользователя ${userId} (статус ${delStatus}): ${err.message}`);
              }
            }
          }
        }

        // --- Итог ---
        console.log(`\n${'='.repeat(66)}`);
        console.log(`📊 Итого: ${passed} прошло, ${failed} провалено из ${testData.length} наборов тестовых данных`);
        console.log(`${'='.repeat(66)}`);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "user": {
              "login": "",
              "password": "",
              "email": "",
              "fio": {
                "firstName": "",
                "lastName": "",
                "secondName": ""
              }
            }
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }

docs: |
  Создаёт нового пользователя.

  Требования к полям:
  - login — обязателен. Пробелы по краям обрезаются, значение приводится к нижнему регистру, допускаются только латинские буквы и цифры ([a-z0-9]). Логин уникален.
  - password — обязателен. Хранится в виде BCrypt-хэша и в ответе не возвращается.
  - email — обязателен. Пробелы по краям обрезаются, проверяется формат и уникальность.
  - fio.firstName, fio.lastName — обязательны, не могут быть пустыми после обрезки пробелов. Сохраняются обрезанными.
  - fio.secondName — необязателен.

  Пользователь создаётся со статусом INACTIVE.

  Ответы:
  - 201 — пользователь создан; в payload возвращаются id, login, email и ФИО.
  - 400 — логин или email пустые; логин содержит недопустимые символы; логин или email
  уже заняты; некорректный формат email; имя или фамилия пустые.
