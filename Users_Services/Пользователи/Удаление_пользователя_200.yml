info:
  name: Удаление_пользователя_200
  type: http
  seq: 2
  tags:
    - Пользователи

http:
  method: DELETE
  url: "{{baseUrl}}/api/user/:id"
  params:
    - name: id
      value: "{{testDeliteUserId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Создание нового тестового пользователя
        const baseURL = bru.getEnvVar('baseUrl');

        const suffix = Math.random().toString(36).substring(2, 8);
        const userData = {
          "user": {
            "login": "testLogin" + suffix,
            "password": "testPassword" + suffix,
            "email": "test" + suffix + "@mail.ru",
            "fio": {
              "firstName": "testName",
              "lastName": "testLastname",
              "secondName": "testSecondname"
            }
          }
        };

        const resNew = await bru.sendRequest({
          method: 'POST',
          url: `${baseURL}/api/user/register`,
          headers: { 'Content-Type': 'application/json' },
          data: userData,
          timeout: 10000
        });

        if (resNew.status === 201) {
          const newId = resNew.data?.payload?.user?.id || resNew.data?.id || resNew.body?.payload?.user?.id;
          if (!newId) throw new Error('Невозможно извлечь ID из полученного response');
          
          bru.setVar('testDeliteUserId', newId);
        } else {
          throw new Error(`Ошибка создания тестового пользователя: статус ${resNew.status}`);
        }
    - type: tests
      code: |-
        // 1. Проверяем код выполнения DELETE
        test("Status cod = 200", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Status text = OK", function () {
            const body = res.getBody();
            expect(body.status).to.equal("OK");
        });

        // 2. Отправляем GET, чтобы убедиться, что пользователя нет
        const baseURL = bru.getEnvVar('baseUrl');
        const userId = bru.getVar('testDeliteUserId');
        let checkRes;
        try {
          checkRes = await bru.sendRequest({
            method: 'GET',
            url: `${baseURL}/api/user/${userId}`,
            headers: { 'Content-Type': 'application/json' },
            timeout: 5000
          });
        } catch (err) {
          // Axios бросает исключение на 404 — ловим и достаём response из ошибки
          checkRes = err.response || { status: err.status || null };
        }

        // 3. Проверяем, что сервер ответил 404 (пользователь не найден)
        test('Пользователь удалён из БД (GET вернул 404)', function() {
          expect(checkRes.status).to.equal(404);
        });

        bru.deleteVar('testDeliteUserId');

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/user/:id"
      method: DELETE
      params:
        - name: id
          value: ""
          type: path
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "message": "",
            "status": "OK",
            "payload": {
              "user": {
                "id": "",
                "login": "",
                "email": "",
                "fio": {
                  "firstName": "",
                  "lastName": "",
                  "secondName": ""
                }
              }
            }
          }

docs: |
  Помечает пользователя удалённым (мягкое удаление): запись остаётся в базе с признаком
  is_deleted, после чего пользователь не возвращается остальными эндпоинтами (404).

  Текст результата возвращается в поле message, payload отсутствует.

  Ответы:
  - 200 — пользователь помечен удалённым.
  - 404 — пользователь не найден, в том числе при повторном удалении.
